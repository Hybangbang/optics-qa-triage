[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optics-qa-triage"
version = "0.1.0"
description = "Read-only, human-in-the-loop optics Q&A triage assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["requests>=2.32,<3"]

[project.scripts]
optics-qa = "optics_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optics_qa = ["prompts/*.md", "references/*.md"]
